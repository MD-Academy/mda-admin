<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Usage Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=28">
    <style>
        .usage-section { margin-bottom: 30px; }
        .usage-section h3 { font-size: 16px; margin: 0 0 4px; }
        .usage-section p.hint { margin: 0 0 14px; }
        .stat-cell { font-variant-numeric: tabular-nums; }
        .pct-bar { display:inline-block; width:70px; height:7px; border-radius:99px; background:var(--bg); overflow:hidden; vertical-align:middle; margin-right:8px; }
        .pct-bar i { display:block; height:100%; background:var(--blue-500,#2563eb); }
    </style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/usage.js"></script>
    <script>
        (async () => {
            const auth = await requireSuperadmin();
            if (!auth) return;
            renderLayout('usage', 'Usage Analytics', 'How much students and staff actually use the LMS', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="usage-section">
                    <h3>Per-course engagement</h3>
                    <p class="hint">Enrolled students, how many were active in the last 30 days, and total quiz attempts — per course.</p>
                    <div class="panel"><table class="data-table">
                        <thead><tr><th>Course</th><th>Enrolled</th><th>Active (30d)</th><th>Quiz attempts</th></tr></thead>
                        <tbody id="course-tbody"><tr><td colspan="4" class="loader">Loading…</td></tr></tbody>
                    </table></div>
                </div>

                <div class="usage-section">
                    <h3>Student engagement</h3>
                    <p class="hint">Time in the portal, quiz &amp; exam activity, and attendance — search, filter by course, and sort to spot who needs attention.</p>
                    <div class="toolbar" style="flex-wrap:wrap;gap:10px;margin-bottom:14px;">
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="usage-search" placeholder="Search students…" oninput="onUsageSearch()">
                        </div>
                        <select id="usage-course-filter" onchange="onUsageCourseFilter()" style="height:42px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;cursor:pointer;">
                            <option value="">All courses</option>
                        </select>
                        <select id="usage-sort" onchange="onUsageSort()" style="height:42px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;cursor:pointer;">
                            <option value="time">Most time in portal</option>
                            <option value="inactive">Least active first</option>
                            <option value="quiz">Lowest quiz scores first</option>
                            <option value="exam">Lowest exam scores first</option>
                            <option value="attendance">Lowest attendance first</option>
                        </select>
                    </div>
                    <div class="panel"><table class="data-table">
                        <thead><tr><th>Student</th><th>Total time</th><th>Sessions</th><th>Last active</th><th>Quizzes</th><th>Exams</th><th>Attendance</th></tr></thead>
                        <tbody id="student-tbody"><tr><td colspan="7" class="loader">Loading…</td></tr></tbody>
                    </table></div>
                </div>

                <div class="usage-section">
                    <h3>Staff usage of the admin panel</h3>
                    <p class="hint">Total time signed into the admin panel, number of sessions, and last activity.</p>
                    <div class="panel"><table class="data-table">
                        <thead><tr><th>Staff member</th><th>Role</th><th>Total time</th><th>Sessions</th><th>Last active</th></tr></thead>
                        <tbody id="staff-tbody"><tr><td colspan="5" class="loader">Loading…</td></tr></tbody>
                    </table></div>
                </div>`;
            loadUsage();
        })();
    </script>
</body>
</html>
