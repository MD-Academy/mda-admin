<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Subjects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=5">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- ROOM CREATE / EDIT MODAL -->
    <div class="modal-overlay" id="room-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="room-modal-title">Add Subject</h3>
                <button class="modal-close" onclick="closeModal('room-modal')">&times;</button>
            </div>
            <form onsubmit="saveRoom(event)">
                <div class="modal-body">
                    <div class="alert" id="room-alert" style="display:none;"></div>
                    <input type="hidden" id="room-id">
                    <div class="form-field">
                        <label>Subject Name</label>
                        <input type="text" id="room-name" placeholder="e.g. Biology" required oninput="syncSlug()">
                    </div>
                    <div class="form-field">
                        <label>URL Slug</label>
                        <input type="text" id="room-slug" placeholder="biology" required>
                        <div class="hint">Lowercase identifier used internally. Auto-filled from the name.</div>
                    </div>
                    <div class="form-field">
                        <label>Description <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <textarea id="room-desc" placeholder="Short description of this subject…"></textarea>
                    </div>
                    <div class="form-field">
                        <label>Display Order</label>
                        <input type="number" id="room-order" min="1" step="1" value="1">
                        <div class="hint">Lower numbers appear first for students.</div>
                    </div>
                    <div class="form-field">
                        <label>Cover Image <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <label class="upload-zone" for="room-image-file" style="padding:18px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <p id="room-image-text">Click to choose an image</p>
                            <span>PNG, JPG, WEBP, GIF — up to 500&nbsp;KB</span>
                            <input type="file" id="room-image-file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="onRoomImagePicked(event)">
                        </label>
                        <div class="hint" id="room-image-current"></div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('room-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="room-save-btn">Save Subject</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/subjects.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            renderLayout('subjects', 'Subjects', 'Open a subject to manage its presentations, video lectures and quizzes', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar">
                    <div></div>
                    <div class="toolbar-actions">
                        <button class="btn btn-primary" onclick="openRoomModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Subject
                        </button>
                    </div>
                </div>
                <div id="rooms-container"><div class="loader">Loading rooms…</div></div>
            `;

            loadRooms();
        })();
    </script>
</body>
</html>
