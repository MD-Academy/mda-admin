<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Gradebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- SCORE ENTRY MODAL (PDF exams) -->
    <div class="modal-overlay" id="score-modal">
        <div class="modal">
            <div class="modal-head">
                <h3>Enter Score</h3>
                <button class="modal-close" onclick="closeModal('score-modal')">&times;</button>
            </div>
            <form onsubmit="saveScore(event)">
                <div class="modal-body">
                    <div class="alert" id="score-alert" style="display:none;"></div>
                    <input type="hidden" id="score-student">
                    <input type="hidden" id="score-exam">
                    <p id="score-context" style="font-size:14px;color:var(--text-muted);margin-bottom:14px;"></p>
                    <div class="form-field">
                        <label>Score (%)</label>
                        <input type="number" id="score-value" min="0" max="100" step="1" required>
                        <div class="hint" id="score-pass-hint"></div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('score-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="score-save-btn">Save Score</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/gradebook.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;
            CURRENT_UID = auth.session.user.id;
            renderLayout('gradebook', 'Gradebook', 'Exam & quiz scores by course', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar" style="flex-wrap:wrap;gap:10px;">
                    <select id="course-select" class="filter-select" onchange="onCourseChange()">
                        <option value="">Select a course…</option>
                    </select>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="gb-search" placeholder="Find a student by name…" oninput="onGbSearch()">
                    </div>
                    <select id="page-size" class="filter-select" onchange="onGbPageSize()">
                        <option value="50">50 / page</option>
                        <option value="25">25 / page</option>
                        <option value="100">100 / page</option>
                    </select>
                </div>
                <div id="gradebook-container"><div class="loader">Choose a course to see its score card.</div></div>
                <div id="pager" style="display:none;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap;">
                    <div id="pager-info" style="font-size:13px;color:var(--text-muted);"></div>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="btn btn-ghost btn-sm" id="prev-btn" onclick="changeGbPage(-1)">← Prev</button>
                        <span id="page-label" style="font-size:13px;color:var(--text);"></span>
                        <button class="btn btn-ghost btn-sm" id="next-btn" onclick="changeGbPage(1)">Next →</button>
                    </div>
                </div>
            `;
            loadCourses();
        })();
    </script>
</body>
</html>
