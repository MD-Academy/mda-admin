<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Personal Meetings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=6">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- CREATE MEETING MODAL -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="m-modal-title">Create Meeting</h3>
                <button class="modal-close" onclick="closeModal('create-modal')">&times;</button>
            </div>
            <form onsubmit="submitMeeting(event)">
                <div class="modal-body">
                    <div class="alert" id="m-alert" style="display:none;"></div>
                    <input type="hidden" id="m-id">
                    <div class="form-field">
                        <label>Course</label>
                        <select id="m-course" class="filter-select" style="width:100%;"><option value="">Select a course…</option></select>
                        <div class="hint">Only students enrolled in this course will see and book this meeting.</div>
                    </div>
                    <div class="form-field">
                        <label>Date</label>
                        <input type="date" id="m-date" required>
                    </div>
                    <div class="form-row" style="display:flex;gap:12px;flex-wrap:wrap;">
                        <div class="form-field" style="flex:1;min-width:120px;">
                            <label>Start time</label>
                            <input type="time" id="m-start" value="09:00" required>
                        </div>
                        <div class="form-field" style="flex:1;min-width:120px;">
                            <label>End time</label>
                            <input type="time" id="m-end" value="22:00" required>
                        </div>
                        <div class="form-field" style="flex:1;min-width:120px;">
                            <label>Slot length</label>
                            <select id="m-slot" class="filter-select" style="width:100%;">
                                <option value="10">10 min</option>
                                <option value="15" selected>15 min</option>
                                <option value="20">20 min</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Meeting link (optional — can add later)</label>
                        <input type="text" id="m-link" placeholder="https://zoom.us/… or https://meet.google.com/…">
                        <div class="hint">Any Zoom / Google Meet / other link. Students see it as a clickable link.</div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('create-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="m-save-btn">Create Meeting</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/meetings.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;
            CURRENT_UID = auth.session.user.id;
            renderLayout('meetings', 'Personal Meetings', 'One-on-one meeting slots students book themselves', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar" style="justify-content:flex-end;">
                    <button class="btn btn-primary" onclick="openCreateModal()">+ Create Meeting</button>
                </div>
                <div id="meetings-container"><div class="loader">Loading meetings…</div></div>
            `;
            await loadCourses();
            loadMeetings();
        })();
    </script>
</body>
</html>
