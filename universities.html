<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — University Selection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=2">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- UNIVERSITY EDIT MODAL -->
    <div class="modal-overlay" id="uni-modal">
        <div class="modal wide">
            <div class="modal-head">
                <h3 id="uni-modal-title">Add University</h3>
                <button class="modal-close" onclick="closeModal('uni-modal')">&times;</button>
            </div>
            <form onsubmit="saveUni(event)">
                <div class="modal-body">
                    <div class="alert" id="uni-alert" style="display:none;"></div>
                    <input type="hidden" id="uni-id">
                    <div class="form-field">
                        <label>University name <span style="color:var(--red);">*</span></label>
                        <input type="text" id="uni-name" placeholder="e.g. Charles University, 1st Faculty of Medicine" required>
                    </div>
                    <div class="form-row" style="display:flex;gap:12px;flex-wrap:wrap;">
                        <div class="form-field" style="flex:1;min-width:160px;">
                            <label>City / location</label>
                            <input type="text" id="uni-location" placeholder="e.g. Prague">
                        </div>
                        <div class="form-field" style="flex:1;min-width:160px;">
                            <label>Country</label>
                            <input type="text" id="uni-country" placeholder="e.g. Czech Republic">
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Costs</label>
                        <input type="text" id="uni-costs" placeholder="e.g. €5,500 / year tuition">
                    </div>
                    <div class="form-field">
                        <label>Website <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <input type="text" id="uni-website" placeholder="https://…">
                    </div>
                    <div class="form-field">
                        <label>Application link <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <input type="text" id="uni-app-link" placeholder="https://… (where students apply / register)">
                        <div class="hint">Shown to students in the university details. Leave blank if there's no direct link.</div>
                    </div>
                    <div class="form-field">
                        <label>Short description</label>
                        <textarea id="uni-desc" placeholder="A few lines about the school — what students should know…"></textarea>
                    </div>

                    <div class="form-field">
                        <label>Degrees offered <span style="color:var(--red);">*</span></label>
                        <div id="uni-degree-chips" class="pill-zone pill-zone-assigned" style="margin-bottom:8px;"></div>
                        <div class="pill-label">Quick add</div>
                        <div id="uni-degree-quick" class="pill-zone" style="margin-bottom:8px;"></div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="uni-degree-input" placeholder="Add another degree…" style="flex:1;">
                            <button type="button" class="btn btn-ghost btn-sm" onclick="addCustomDegree()">Add</button>
                        </div>
                    </div>

                    <div class="form-field">
                        <label>Exam date(s) <span style="color:var(--text-muted);font-weight:400;">(optional — add as many as needed)</span></label>
                        <div id="uni-exam-chips" class="pill-zone pill-zone-assigned" style="margin-bottom:8px;"></div>
                        <div style="display:flex;gap:8px;">
                            <input type="date" id="uni-exam-input" style="flex:1;">
                            <button type="button" class="btn btn-ghost btn-sm" onclick="addExamDateFromInput()">Add date</button>
                        </div>
                    </div>

                    <div class="form-field">
                        <label>Photo <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <label for="uni-image-file" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border:1.5px dashed var(--border);border-radius:12px;cursor:pointer;text-align:center;">
                            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="var(--blue-500,#2563eb)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                            <strong id="uni-image-text">Click to choose an image</strong>
                            <span style="font-size:12px;color:var(--text-muted);">PNG, JPG, WEBP, GIF — up to 500 KB</span>
                        </label>
                        <input type="file" id="uni-image-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" onchange="onUniImagePicked(event)">
                        <div class="hint" id="uni-image-current"></div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('uni-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="uni-save-btn">Save University</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/universities.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;
            renderLayout('universities', 'University Selection', 'Partner universities & where your students are headed', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div style="display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;">
                    <button id="tabbtn-unis" class="tab-btn active" onclick="showUniTab('unis')">Universities</button>
                    <button id="tabbtn-report" class="tab-btn" onclick="showUniTab('report')">Student selections</button>
                    <button id="tabbtn-accept" class="tab-btn" onclick="showUniTab('accept')">Acceptances &amp; outcomes</button>
                </div>
                <div id="tab-unis">
                    <div class="toolbar" style="justify-content:flex-end;">
                        <button class="btn btn-primary" onclick="openUniModal()">+ Add University</button>
                    </div>
                    <div id="unis-list"><div class="loader">Loading universities…</div></div>
                </div>
                <div id="tab-report" style="display:none;">
                    <div class="toolbar" style="flex-wrap:wrap;gap:10px;align-items:center;">
                        <select id="report-course" class="filter-select" onchange="onReportCourse()">
                            <option value="">All courses</option>
                        </select>
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="report-search" placeholder="Find a student by name…" oninput="onReportSearch()">
                        </div>
                        <select id="report-sort" class="filter-select" onchange="onReportSort()">
                            <option value="fewest">Fewest selections first</option>
                            <option value="az">Name (A–Z)</option>
                        </select>
                        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);white-space:nowrap;" title="Students see this as a friendly recommendation to select at least this many universities.">
                            Target schools:
                            <input type="number" id="report-target" min="1" max="20" value="3" oninput="onReportTarget()"
                                style="height:42px;width:68px;border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);background:var(--card);outline:none;text-align:center;">
                            <span id="target-saved" style="font-size:12px;font-weight:600;min-width:48px;"></span>
                        </label>
                        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;">
                            <input type="checkbox" id="report-attention" onchange="onReportAttention()" style="width:18px;height:18px;accent-color:var(--red);">
                            Needs attention only
                        </label>
                    </div>
                    <div id="report-summary" style="margin:0 0 14px;font-size:14px;color:var(--text);"></div>
                    <div id="report-list"><div class="loader">Loading…</div></div>
                </div>
                <div id="tab-accept" style="display:none;">
                    <div class="toolbar" style="flex-wrap:wrap;gap:10px;align-items:center;">
                        <select id="accept-course" class="filter-select" onchange="onAcceptCourse()">
                            <option value="">All courses</option>
                        </select>
                    </div>
                    <div id="accept-content"><div class="loader">Loading…</div></div>
                </div>
            `;
            loadUnis();
        })();
    </script>
</body>
</html>
