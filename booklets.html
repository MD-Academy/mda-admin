<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Digital Booklets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=4">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- UPLOAD MODAL -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <div class="modal-head">
                <h3>Upload Booklet</h3>
                <button class="modal-close" onclick="closeModal('upload-modal')">&times;</button>
            </div>
            <form onsubmit="saveUpload(event)">
                <div class="modal-body">
                    <div class="alert" id="upload-alert" style="display:none;"></div>
                    <input type="hidden" id="upload-source" value="file">
                    <div class="seg-toggle" style="display:flex;gap:8px;margin-bottom:16px;">
                        <button type="button" class="btn btn-primary btn-sm" id="src-btn-file" onclick="setUploadSource('file')" style="flex:1;">⬆ Upload file</button>
                        <button type="button" class="btn btn-ghost btn-sm" id="src-btn-link" onclick="setUploadSource('link')" style="flex:1;">🔗 External link</button>
                    </div>
                    <div id="src-file">
                        <label class="upload-zone" for="booklet-file">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <p id="upload-zone-text">Click to choose a file</p>
                            <span>PDF, PPTX, DOCX, images — up to 50&nbsp;MB</span>
                            <input type="file" id="booklet-file" accept=".pdf,.ppt,.pptx,.doc,.docx,.png,.jpg,.jpeg" onchange="onFilePicked(event)">
                        </label>
                    </div>
                    <div id="src-link" style="display:none;">
                        <div class="form-field">
                            <label>External link (URL)</label>
                            <input type="url" id="booklet-url" placeholder="https://…  link to a file hosted on any platform">
                            <span style="display:block;margin-top:6px;color:var(--text-muted);font-size:12px;">Paste a direct https link to a file hosted anywhere (AWS, Google Drive, etc.). It opens in a new tab for students.</span>
                        </div>
                    </div>
                    <div class="form-field" style="margin-top:18px;">
                        <label>Title</label>
                        <input type="text" id="booklet-title" placeholder="e.g. Final Exam Simulation — Booklet 1" required>
                    </div>
                    <div class="hint">New booklets start <strong>hidden</strong>. Use the eye toggle to release them to students.</div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('upload-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="upload-btn">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/booklets.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            renderLayout('booklets', 'Digital Booklets', 'Exam-simulation booklets for all students', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Search booklets by title…" oninput="applyFilters()">
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn btn-primary" onclick="openUploadModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            Upload Booklet
                        </button>
                    </div>
                </div>
                <div class="panel">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Type</th>
                                <th>Student visibility</th>
                                <th>Uploaded</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="booklets-tbody">
                            <tr><td colspan="5" class="loader">Loading booklets…</td></tr>
                        </tbody>
                    </table>
                </div>
            `;

            loadBooklets();
        })();
    </script>
</body>
</html>
