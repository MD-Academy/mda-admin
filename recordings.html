<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Zoom Recordings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=11">
    <style>
        /* Let the row ⋯ menu show without being clipped by the table panel. */
        .panel { overflow: visible; }
        .row-menu-wrap { position: relative; display: inline-block; vertical-align: middle; }
        .row-dots { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px;
            border:1px solid var(--border); background:#fff; color:#334155; font-size:18px; line-height:1; cursor:pointer; }
        .row-dots:hover { background:#f1f5f9; }
        .card-menu { position:absolute; top:calc(100% + 4px); right:0; z-index:30; background:#fff; border:1px solid var(--border);
            border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.16); min-width:200px; padding:6px; display:none; }
        .card-menu.open { display:block; }
        .card-menu button { width:100%; text-align:left; background:none; border:none; padding:9px 11px; border-radius:7px;
            cursor:pointer; font-size:13.5px; font-family:inherit; color:var(--text); display:flex; align-items:center; gap:9px; }
        .card-menu button:hover { background:#f1f5f9; }
    </style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- RECORDING CREATE / EDIT MODAL -->
    <div class="modal-overlay" id="rec-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="rec-modal-title">Add Recording</h3>
                <button class="modal-close" onclick="closeModal('rec-modal')">&times;</button>
            </div>
            <form onsubmit="saveRecording(event)">
                <div class="modal-body">
                    <div class="alert" id="rec-alert" style="display:none;"></div>
                    <input type="hidden" id="rec-id">
                    <div class="form-field">
                        <label>Title</label>
                        <input type="text" id="rec-title" placeholder="e.g. Biology — Class 12 Jun" required>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label>Professor</label>
                            <input type="text" id="rec-professor" placeholder="e.g. Dr. Levin" required>
                        </div>
                        <div class="form-field">
                            <label>Recorded Date</label>
                            <input type="date" id="rec-date" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Video URL (AWS)</label>
                        <input type="url" id="rec-url" placeholder="https://…amazonaws.com/…/video.mp4" required>
                        <div class="hint">Permanent link to the recording. It plays inside the LMS.</div>
                    </div>
                    <div class="form-field">
                        <label>Duration in minutes <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <input type="number" id="rec-duration" min="0" step="1" placeholder="e.g. 90">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('rec-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="rec-save-btn">Save Recording</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LIVE CLASS LINK CREATE / EDIT MODAL -->
    <div class="modal-overlay" id="link-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="link-modal-title">Add live class link</h3>
                <button class="modal-close" onclick="closeModal('link-modal')">&times;</button>
            </div>
            <form onsubmit="saveLink(event)">
                <div class="modal-body">
                    <div class="alert" id="link-alert" style="display:none;"></div>
                    <input type="hidden" id="link-id">
                    <div class="form-field">
                        <label>Course</label>
                        <select id="link-course" required><option value="">— Select a course —</option></select>
                        <div class="hint">Only students enrolled in this course will see the link.</div>
                    </div>
                    <div class="form-field">
                        <label>Title / class</label>
                        <input type="text" id="link-title" placeholder="e.g. Biology — Weekly Live Class" required>
                    </div>
                    <div class="form-field">
                        <label>Host / created by</label>
                        <input type="text" id="link-host" placeholder="e.g. Dr. Levin" required>
                    </div>
                    <div class="form-field">
                        <label>Zoom link (URL)</label>
                        <input type="url" id="link-url" placeholder="https://zoom.us/j/…" required>
                        <div class="hint">Students open this in a new tab or copy it. Must start with https://</div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('link-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="link-save-btn">Save link</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/recordings.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            renderLayout('recordings', 'Zoom Recordings', 'Upload and manage class recordings, organised by date', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="tabs">
                    <button class="tab active" data-tab="recordings" onclick="switchTab('recordings')">Recordings <span class="count-pill" id="count-recordings">0</span></button>
                    <button class="tab" data-tab="links" onclick="switchTab('links')">Live Class Links <span class="count-pill" id="count-links">0</span></button>
                </div>

                <div class="tab-panel active" id="panel-recordings">
                <div class="toolbar" style="flex-wrap:wrap;gap:10px;">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Search by title or professor…" oninput="onSearchInput()">
                    </div>
                    <select id="course-filter" class="filter-select" onchange="onFilterChange()">
                        <option value="">All courses</option>
                    </select>
                    <label style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">From
                        <input type="date" id="date-from" onchange="onFilterChange()" style="height:38px;border:1.5px solid var(--border);border-radius:8px;padding:0 8px;font-family:inherit;"></label>
                    <label style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">To
                        <input type="date" id="date-to" onchange="onFilterChange()" style="height:38px;border:1.5px solid var(--border);border-radius:8px;padding:0 8px;font-family:inherit;"></label>
                    <select id="page-size" onchange="onFilterChange()" class="filter-select">
                        <option value="25">25 / page</option>
                        <option value="50">50 / page</option>
                        <option value="100">100 / page</option>
                    </select>
                    <div class="toolbar-actions">
                        <button class="btn btn-primary" onclick="openRecModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Recording
                        </button>
                    </div>
                </div>
                <div class="panel">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Courses</th>
                                <th>Professor</th>
                                <th>Duration</th>
                                <th>Visible</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="rec-tbody">
                            <tr><td colspan="7" class="loader">Loading recordings…</td></tr>
                        </tbody>
                    </table>
                    <div id="pager" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 4px;flex-wrap:wrap;">
                        <div id="pager-info" style="font-size:13px;color:var(--text-muted);"></div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <button class="btn btn-ghost btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
                            <span id="page-label" style="font-size:13px;color:var(--text);"></span>
                            <button class="btn btn-ghost btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
                        </div>
                    </div>
                </div>
                </div>

                <div class="tab-panel" id="panel-links">
                    <div class="subtoolbar">
                        <div class="st-title">Live Class Links</div>
                        <button class="btn btn-primary btn-sm" onclick="openLinkModal()">+ Add link</button>
                    </div>
                    <p class="hint" style="margin:-6px 0 16px;">Live Zoom join links students can open or copy. Choose the course so only its enrolled students see the link. These are separate from recordings.</p>
                    <div class="panel">
                        <table class="data-table">
                            <thead><tr><th>Title</th><th>Course</th><th>Host</th><th>Link</th><th>Visible</th><th>Actions</th></tr></thead>
                            <tbody id="links-tbody"><tr><td colspan="6" class="loader">Loading…</td></tr></tbody>
                        </table>
                    </div>
                </div>
            `;

            await loadCourseOptions();
            loadRecordings();
            loadMeetingLinks();
        })();
    </script>
</body>
</html>
