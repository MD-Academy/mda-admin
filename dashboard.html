<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=6">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            renderLayout('dashboard', 'Dashboard', 'Welcome to the MDA management portal', auth.profile);

            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="welcome-banner">
                    <h2>Welcome back, ${_layoutEsc(auth.profile.full_name || 'Admin')}!</h2>
                    <p>Manage students, content, recordings, quizzes and more from here.</p>
                </div>
                <div class="stat-grid" id="stats">
                    <div class="loader">Loading statistics…</div>
                </div>
            `;

            try {
                const [students, rooms, recordings, announcements] = await Promise.all([
                    db.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'student'),
                    db.from('rooms').select('id', { count: 'exact', head: true }),
                    db.from('recordings').select('id', { count: 'exact', head: true }),
                    db.from('announcements').select('id', { count: 'exact', head: true })
                ]);

                document.getElementById('stats').innerHTML = `
                    ${statCard('blue', students.count ?? 0, 'Total Students', '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>')}
                    ${statCard('green', rooms.count ?? 0, 'Subjects', '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>')}
                    ${statCard('gold', recordings.count ?? 0, 'Recordings', '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>')}
                    ${statCard('crimson', announcements.count ?? 0, 'Announcements', '<path d="M3 11l18-5v12L3 14v-3z"/>')}
                `;
            } catch (err) {
                document.getElementById('stats').innerHTML = `<div class="loader" style="color:var(--red)">Failed to load statistics: ${err.message}</div>`;
            }

            function statCard(color, value, label, icon) {
                return `
                    <div class="stat-card">
                        <div class="stat-icon ${color}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value">${value}</div>
                            <div class="stat-label">${label}</div>
                        </div>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
