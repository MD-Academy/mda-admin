<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Work Hours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=7">
    <style>
        .wh-clock { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        .wh-clock.open { border-color: #a7f3d0; background: #f0fdf4; }
        .wh-status { font-size: 18px; font-weight: 800; color: var(--navy-800); }
        .wh-since { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .wh-elapsed { font-size: 40px; font-weight: 800; color: var(--navy-800); margin: 12px 0; font-variant-numeric: tabular-nums; }
        .wh-note { color: var(--text-muted); font-size: 14px; margin-bottom: 14px; }
        .wh-totals { display: flex; gap: 14px; flex-wrap: wrap; }
        .wh-total { flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
        .wh-total-n { font-size: 22px; font-weight: 800; color: var(--navy-800); }
        .wh-total-l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        /* Print only the report block. */
        @media print {
            body * { visibility: hidden; }
            #report-box, #report-box * { visibility: visible; }
            #report-box { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/work-hours.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;
            CURRENT_UID = auth.session.user.id;
            IS_SUPER = !!(auth.profile && auth.profile.role === 'superadmin');
            renderLayout('work-hours', 'Work Hours', 'Clock in when you start, clock out when you finish', auth.profile);
            initWorkHours();
        })();
    </script>
</body>
</html>
