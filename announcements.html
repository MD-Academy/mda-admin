<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Announcements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=5">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- ANNOUNCEMENT MODAL -->
    <div class="modal-overlay" id="ann-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="ann-modal-title">New Announcement</h3>
                <button class="modal-close" onclick="closeModal('ann-modal')">&times;</button>
            </div>
            <form onsubmit="saveAnnouncement(event)">
                <div class="modal-body">
                    <div class="alert" id="ann-alert" style="display:none;"></div>
                    <input type="hidden" id="ann-id">
                    <div class="form-field">
                        <label>Show to</label>
                        <select id="ann-target"><option value="">— General (all students) —</option></select>
                        <div class="hint">Keep "General" for everyone (e.g. office notices), or pick a course so only its enrolled students see it.</div>
                    </div>
                    <div class="form-field">
                        <label>Title</label>
                        <input type="text" id="ann-title" placeholder="e.g. Holiday schedule update" required>
                    </div>
                    <div class="form-field">
                        <label>Message</label>
                        <textarea id="ann-body" placeholder="Write the announcement students will see…" style="min-height:140px;" required></textarea>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('ann-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="ann-save-btn">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/announcements.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            renderLayout('announcements', 'Announcements', 'Post notices that all students will see', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar" style="flex-wrap:wrap;gap:10px;">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Search announcements…" oninput="onSearchInput()">
                    </div>
                    <select id="page-size" class="filter-select" onchange="onFilterChange()">
                        <option value="25">25 / page</option>
                        <option value="50">50 / page</option>
                        <option value="100">100 / page</option>
                    </select>
                    <div class="toolbar-actions">
                        <button class="btn btn-primary" onclick="openAnnModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            New Announcement
                        </button>
                    </div>
                </div>
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">Announcements older than 4 months are removed automatically.</div>
                <div id="ann-list"><div class="loader">Loading announcements…</div></div>
                <div id="pager" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap;">
                    <div id="pager-info" style="font-size:13px;color:var(--text-muted);"></div>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="btn btn-ghost btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
                        <span id="page-label" style="font-size:13px;color:var(--text);"></span>
                        <button class="btn btn-ghost btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
                    </div>
                </div>
            `;

            await loadAnnCourses();
            loadAnnouncements();
        })();
    </script>
</body>
</html>
