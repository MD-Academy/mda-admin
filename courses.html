<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Courses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=19">
    <style>
        .card-menu-btn { position:absolute; top:10px; right:10px; z-index:5; width:32px; height:32px; border-radius:50%; border:none;
            background:rgba(255,255,255,.92); box-shadow:0 1px 5px rgba(0,0,0,.18); cursor:pointer; font-size:20px; line-height:1;
            color:#334155; display:flex; align-items:center; justify-content:center; }
        .card-menu-btn:hover { background:#fff; }
        .card-menu { position:absolute; top:46px; right:10px; z-index:6; background:#fff; border:1px solid var(--border);
            border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.16); min-width:190px; padding:6px; display:none; }
        .card-menu.open { display:block; }
        .card-menu button { width:100%; text-align:left; background:none; border:none; padding:9px 11px; border-radius:7px;
            cursor:pointer; font-size:13.5px; font-family:inherit; color:var(--text); display:flex; align-items:center; gap:9px; }
        .card-menu button:hover { background:#f1f5f9; }
    </style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- COURSE CREATE / EDIT MODAL -->
    <div class="modal-overlay" id="course-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="course-modal-title">Add Course</h3>
                <button class="modal-close" onclick="closeModal('course-modal')">&times;</button>
            </div>
            <form onsubmit="saveCourse(event)">
                <div class="modal-body">
                    <div class="alert" id="course-alert" style="display:none;"></div>
                    <input type="hidden" id="course-id">
                    <div class="form-field">
                        <label>Course Name</label>
                        <input type="text" id="course-name" placeholder="e.g. Premed Intake — Spring 2027" required>
                    </div>
                    <div class="form-field">
                        <label>Description <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <textarea id="course-desc" placeholder="Short description of this course/cohort…"></textarea>
                    </div>
                    <div class="form-field">
                        <label>Access expires on <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <input type="date" id="course-expiry" style="flex:1;" oninput="toggleCourseExpiryClear()">
                            <button type="button" class="btn btn-ghost btn-sm" id="course-expiry-clear" onclick="clearCourseExpiry()" style="display:none;white-space:nowrap;">Remove expiry</button>
                        </div>
                        <div class="hint">After this date the course (and its subjects) disappears for enrolled students until you extend it. Leave blank — or click <strong>Remove expiry</strong> — for no expiry (the course stays active forever).</div>
                    </div>
                    <div class="form-field">
                        <label>Cover Image <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <label class="upload-zone" for="course-image-file" style="padding:18px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <p id="course-image-text">Click to choose an image</p>
                            <span>PNG, JPG, WEBP, GIF — up to 500&nbsp;KB</span>
                            <input type="file" id="course-image-file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="onCourseImagePicked(event)">
                        </label>
                        <div class="hint" id="course-image-current"></div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('course-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="course-save-btn">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/courses.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            IS_SUPER = auth.profile.role === 'superadmin';
            renderLayout('courses', 'Courses', IS_SUPER ? 'Group subjects into courses and enrol students' : 'Group subjects into courses', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar">
                    <div></div>
                    <div class="toolbar-actions">
                        <button class="btn btn-primary" onclick="openCourseModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Course
                        </button>
                    </div>
                </div>
                <div id="courses-container"><div class="loader">Loading courses…</div></div>
            `;

            loadCourses();
        })();
    </script>
</body>
</html>
