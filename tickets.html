<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Student Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=6">
    <style>
        .badge { display:inline-block; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
        .badge.open { background:#fee2e2; color:#dc2626; }
        .badge.in_progress { background:#dbeafe; color:#2563eb; }
        .badge.completed { background:#dcfce7; color:#16a34a; }
        .msg { padding:12px 14px; border-radius:12px; margin-bottom:10px; max-width:88%; }
        .msg .who { font-size:11.5px; font-weight:700; margin-bottom:4px; opacity:.8; }
        .msg .body { font-size:14px; line-height:1.5; white-space:pre-wrap; }
        .msg.staff { background:#eef4ff; margin-left:auto; }
        .msg.student { background:#f1f5f9; }
        .msg .when { font-size:11px; color:var(--text-muted); margin-top:5px; }
        .shot { margin-top:8px; }
        .shot img { max-width:240px; border-radius:8px; border:1px solid var(--border); display:block; }
        .status-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .status-row .sbtn { cursor:pointer; border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; }
        .status-row .sbtn.active.open { background:#fee2e2; color:#dc2626; border-color:#dc2626; }
        .status-row .sbtn.active.in_progress { background:#dbeafe; color:#2563eb; border-color:#2563eb; }
        .status-row .sbtn.active.completed { background:#dcfce7; color:#16a34a; border-color:#16a34a; }
    </style>
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- TICKET DETAIL MODAL -->
    <div class="modal-overlay" id="ticket-modal">
        <div class="modal wide">
            <div class="modal-head">
                <h3 id="t-title">Ticket</h3>
                <button class="modal-close" onclick="closeModal('ticket-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="alert" id="t-alert" style="display:none;"></div>
                <div style="margin-bottom:14px;">
                    <div class="hint" style="margin-bottom:6px;">Status</div>
                    <div class="status-row" id="t-status-row"></div>
                </div>
                <div id="t-thread"><div class="loader">Loading…</div></div>
                <div style="margin-top:8px;">
                    <textarea id="t-reply" placeholder="Write a response to the student…" style="width:100%;min-height:90px;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Inter',sans-serif;font-size:14px;outline:none;resize:vertical;"></textarea>
                </div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" onclick="closeModal('ticket-modal')">Close</button>
                <button type="button" class="btn btn-primary" id="t-send" onclick="sendReply()">Send response</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tickets.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;
            renderLayout('tickets', 'Student Tickets', 'Problems & suggestions reported by students', auth.profile);

            document.getElementById('page-content').innerHTML = `
                <div class="toolbar" style="flex-wrap:wrap;gap:10px;">
                    <select id="status-filter" class="filter-select" onchange="applyFilters()">
                        <option value="">All statuses</option>
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Search by title or student…" oninput="applyFilters()">
                    </div>
                </div>
                <div class="panel">
                    <table class="data-table">
                        <thead><tr><th>Student</th><th>Title</th><th>Status</th><th>Updated</th><th></th></tr></thead>
                        <tbody id="tickets-tbody"><tr><td colspan="5" class="loader">Loading tickets…</td></tr></tbody>
                    </table>
                </div>`;
            loadTickets();
        })();
    </script>
</body>
</html>
