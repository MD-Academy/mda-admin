<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=1">
    <title>MDA Admin — Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="layout" id="app-layout"></div>

    <!-- LESSON MODAL -->
    <div class="modal-overlay" id="lesson-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="lesson-modal-title">Add Lesson</h3>
                <button class="modal-close" onclick="closeModal('lesson-modal')">&times;</button>
            </div>
            <form onsubmit="saveLesson(event)">
                <div class="modal-body">
                    <div class="alert" id="lesson-alert" style="display:none;"></div>
                    <input type="hidden" id="lesson-id">
                    <div class="form-field">
                        <label>Lesson Title</label>
                        <input type="text" id="lesson-title" placeholder="e.g. Cell Structure & Function" required>
                    </div>
                    <div class="form-field">
                        <label>Description <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <textarea id="lesson-desc" placeholder="What this lesson covers…"></textarea>
                    </div>
                    <div class="form-field">
                        <label>Cover Image URL <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <input type="text" id="lesson-image" placeholder="https://…">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('lesson-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="lesson-save-btn">Save Lesson</button>
                </div>
            </form>
        </div>
    </div>

    <!-- RECORDING / LECTURE MODAL (shared) -->
    <div class="modal-overlay" id="rec-modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="rec-modal-title">Add Recording</h3>
                <button class="modal-close" onclick="closeModal('rec-modal')">&times;</button>
            </div>
            <form onsubmit="saveRecording(event)">
                <div class="modal-body">
                    <div class="alert" id="rec-alert" style="display:none;"></div>
                    <input type="hidden" id="rec-id">
                    <input type="hidden" id="rec-kind">
                    <div class="form-field">
                        <label>Title</label>
                        <input type="text" id="rec-title" placeholder="e.g. Lecture 3 — Cell Biology" required>
                    </div>
                    <div class="form-field">
                        <label>Lesson <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <select id="rec-lesson"><option value="">— None —</option></select>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label id="rec-prof-label">Professor</label>
                            <input type="text" id="rec-professor" placeholder="e.g. Dr. Levin" required>
                        </div>
                        <div class="form-field">
                            <label id="rec-date-label">Date</label>
                            <input type="date" id="rec-date" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Video URL</label>
                        <input type="url" id="rec-url" placeholder="https://…amazonaws.com/…/video.mp4" required>
                        <div class="hint">Permanent link to the video. It plays inside the LMS.</div>
                    </div>
                    <div class="form-field">
                        <label>Duration in minutes <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <input type="number" id="rec-duration" min="0" step="1" placeholder="e.g. 90">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('rec-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="rec-save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MATERIAL UPLOAD MODAL -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <div class="modal-head">
                <h3>Upload Material</h3>
                <button class="modal-close" onclick="closeModal('upload-modal')">&times;</button>
            </div>
            <form onsubmit="saveUpload(event)">
                <div class="modal-body">
                    <div class="alert" id="upload-alert" style="display:none;"></div>
                    <label class="upload-zone" for="material-file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p id="upload-zone-text">Click to choose a file</p>
                        <span>PDF, PPTX, DOCX, images — up to 50&nbsp;MB</span>
                        <input type="file" id="material-file" accept=".pdf,.ppt,.pptx,.doc,.docx,.png,.jpg,.jpeg" onchange="onFilePicked(event)">
                    </label>
                    <div class="form-field" style="margin-top:18px;">
                        <label>Title</label>
                        <input type="text" id="material-title" placeholder="e.g. Cell Structure — Slides" required>
                    </div>
                    <div class="form-field">
                        <label>Lesson <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <select id="material-lesson"><option value="">— None —</option></select>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('upload-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="upload-btn">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MATERIAL EDIT MODAL -->
    <div class="modal-overlay" id="medit-modal">
        <div class="modal">
            <div class="modal-head">
                <h3>Edit Material</h3>
                <button class="modal-close" onclick="closeModal('medit-modal')">&times;</button>
            </div>
            <form onsubmit="saveMaterialEdit(event)">
                <div class="modal-body">
                    <div class="alert" id="medit-alert" style="display:none;"></div>
                    <input type="hidden" id="medit-id">
                    <div class="form-field">
                        <label>Title</label>
                        <input type="text" id="medit-title" required>
                    </div>
                    <div class="form-field">
                        <label>Lesson <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                        <select id="medit-lesson"><option value="">— None —</option></select>
                    </div>
                    <div class="hint">To replace the file itself, delete this material and upload a new one.</div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('medit-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="medit-save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/room.js"></script>
    <script>
        (async () => {
            const auth = await requireAdmin();
            if (!auth) return;

            const params = new URLSearchParams(window.location.search);
            const roomId = params.get('id');
            if (!roomId) { window.location.href = 'rooms.html'; return; }

            await initRoom(roomId, auth.profile);
        })();
    </script>
</body>
</html>
