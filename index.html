<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <title>MDA Admin Portal — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="left-panel">
            <div class="left-content">
                <div class="top-branding">
                    <img src="assets/images/mda-logo.png" alt="Medical Doctor Academy" class="logo-large">
                    <div class="brand-divider"></div>
                    <img src="assets/images/eilat-logo.png" alt="Eilat Medical School" class="logo-large">
                </div>
                <div class="hero-section">
                    <div class="admin-badge">Admin Portal</div>
                    <h1 class="hero-title">Office Management<br>Dashboard</h1>
                    <p class="hero-sub">Manage students, content & more.</p>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="login-card">
                <div class="card-header">
                    <div class="admin-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                    <h2>Admin Sign In</h2>
                    <p>Access restricted to authorized staff only.</p>
                </div>

                <div id="alert-box" class="alert" style="display:none;"></div>

                <form id="login-form" novalidate>
                    <div class="field-group">
                        <div class="input-row">
                            <span class="field-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </span>
                            <input type="email" id="email-input" placeholder="Admin Email" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="field-group">
                        <div class="input-row">
                            <span class="field-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>
                            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required>
                            <button type="button" id="toggle-pw" class="pw-toggle">
                                <svg id="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg id="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-signin" id="signin-btn">
                        <span id="btn-text">Sign In</span>
                        <svg id="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>

                <p class="card-footer">© 2026 Medical Doctor International Academy<br>All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
